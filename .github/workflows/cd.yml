name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build production
        run: bash scripts/buildprod.sh

      - name: Auth GCloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build & Submit to GCloud
        run: bash gcloud builds submit --tag us-central1-docker.pkg.dev/notely-507219/notely-ar-repo/notely:latest

      - name: Deploy to Cloud Run
        run: bash gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-507219/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-507219 --max-instances=4

